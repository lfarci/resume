name: PDF Validity Check

on:
    pull_request:
        paths:
            - "data/**"
            - "fonts/**"
            - "images/**"
            - "sections/**"
            - "resume.tex"
            - "scripts/build-resume.mjs"
            - "scripts/validate-resume.mjs"
            - ".github/actions/build-resume/**"
            - ".github/workflows/pdf-validity-check.yml"

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - name: Cache Tectonic bundle
              uses: actions/cache@v5
              with:
                  path: ~/.cache/Tectonic
                  key: tectonic-${{ runner.os }}-${{ hashFiles('resume.tex') }}
                  restore-keys: tectonic-${{ runner.os }}-

            - name: Install PDF tools
              run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils qpdf

            - name: Install Tectonic
              uses: wtfjoke/setup-tectonic@v3
              with:
                  tectonic-version: "0.15.0"

            - name: Build resume
              uses: ./.github/actions/build-resume

            - name: Check PDF structural validity
              run: qpdf --check build/resume/resume.pdf

            - name: Check fonts are embedded
              run: |
                  output="$(pdffonts build/resume/resume.pdf)"
                  echo "$output"
                  if [ -z "$(echo "$output" | tail -n +3)" ]; then
                      echo "::error::No fonts detected in resume.pdf"
                      exit 1
                  fi
                  if echo "$output" | tail -n +3 | awk '{ if ($(NF-4) != "yes") print }' | grep -q .; then
                      echo "::error::One or more fonts are not embedded in resume.pdf"
                      echo "$output" | tail -n +3 | awk '{ if ($(NF-4) != "yes") print }'
                      exit 1
                  fi

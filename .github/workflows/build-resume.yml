name: Build Resume

on:
    push:
        paths:
            - "data/**"
            - "fonts/**"
            - "images/**"
            - "sections/**"
            - "resume.tex"
            - "scripts/build-resume.mjs"
            - "scripts/validate-resume.mjs"
            - ".github/actions/build-resume/**"
            - ".github/workflows/build-resume.yml"
    pull_request:
        paths:
            - "data/**"
            - "fonts/**"
            - "images/**"
            - "sections/**"
            - "resume.tex"
            - "scripts/build-resume.mjs"
            - "scripts/validate-resume.mjs"
            - ".github/actions/build-resume/**"
            - ".github/workflows/build-resume.yml"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6

            - name: Build and validate resume
              uses: ./.github/actions/build-resume

            - name: Upload resume artifact
              uses: actions/upload-artifact@v6
              with:
                  name: resume-pdf
                  path: |
                      build/resume/resume.pdf
                      build/resume/resume-preview.png
                  if-no-files-found: error
                  retention-days: 30
